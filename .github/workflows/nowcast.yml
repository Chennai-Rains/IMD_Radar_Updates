name: Update nowcast radar map

on:
  # No native `schedule:` trigger here -- GitHub's own cron for a 15-minute
  # interval turned out to be unreliable in practice (real gaps of several
  # hours between fires, see git history around 2026-09-29), so an external
  # pinger (cron-job.org) now calls this workflow's `workflow_dispatch` API
  # endpoint every 15 minutes instead -- see README for the setup. Keeping
  # BOTH triggers active was tried first ("harmless redundant backup"), but
  # that turned out to be an active liability: the two independent 15-min
  # schedules would occasionally fire only a couple of minutes apart, and
  # that tighter-than-normal gap between polls was the direct cause of a
  # real bug (a storm cell briefly showing an impossible ~1560 km/h speed --
  # see track_cells' MAX_PLAUSIBLE_CELL_SPEED_KMH / poll_and_decode's
  # content-hash is_new_frame comment in nowcast_bot.py for the full story).
  # That specific failure mode is now fixed defensively either way, but
  # there's no upside left to firing this from two independent schedulers,
  # so the unreliable one is simply removed.
  workflow_dispatch: {}
    # Lets you trigger a run manually from the Actions tab any time you
    # want to test a change without waiting for the external pinger's next
    # tick -- and is also what the external cron-job.org pinger calls.

# Only one run at a time -- the external 15-minute pinger shouldn't
# normally overlap itself, but this is cheap insurance against two runs
# racing to commit/push state at once if a run ever takes longer than
# expected.
concurrency:
  group: nowcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state/ and archive/ back to the repo

jobs:
  update-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one nowcast polling cycle
        run: python nowcast_bot.py

      - name: Rebase onto latest main before committing
        # A run's git history is fixed the moment actions/checkout runs,
        # but the polling cycle above can take a little while -- if a
        # manual code push (or another run, in a rarer race) lands on
        # main in that window, this run's later commit+push would be
        # rejected as non-fast-forward and its state update silently
        # lost (this is exactly what happened once: a manual push landed
        # mid-run and the state commit that followed got rejected).
        # --autostash handles the uncommitted state/archive/output files
        # this step runs with in the working tree: stash them, fast-
        # forward onto whatever's newest on main (there's nothing of
        # ours to replay -- nothing's committed yet), then restore them
        # on top. continue-on-error, because even if this ever does hit
        # a genuine conflict, that should cost this one cycle's tracking
        # state -- which self-heals next run -- not the live map upload
        # in the step after this one.
        run: git fetch origin main && git rebase origin/main --autostash
        continue-on-error: true

      - name: Commit updated tracking state + frame archive
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update nowcast tracking state"
          file_pattern: "state/ archive/"
          commit_user_name: "nowcast-bot"
          commit_user_email: "actions@users.noreply.github.com"

      - name: Upload storm_forecast_map.html to plots.chennairains.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # cPanel's FTP Accounts page for this account explicitly offers
          # "FTP & explicit FTPS" on port 21 -- explicit FTPS negotiates
          # TLS over the same plain-FTP port (STARTTLS-style), so this is
          # both more secure than plain FTP and matches what the host
          # actually advertises supporting.
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map.html.
          dangerous-clean-slate: false
