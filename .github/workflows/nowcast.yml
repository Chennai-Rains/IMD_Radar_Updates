name: Update nowcast radar map

on:
  schedule:
    # Every 15 minutes. GitHub Actions doesn't guarantee this fires at
    # exactly :00/:15/:30/:45 -- under load it can slip by a few minutes,
    # which is fine here since the radars themselves only refresh every
    # ~10 minutes anyway.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
    # Lets you trigger a run manually from the Actions tab any time you
    # want to test a change without waiting for the next scheduled tick.

# Only one run at a time -- a 15-minute cron shouldn't normally overlap,
# but this is cheap insurance against two runs racing to commit/push state
# at once if a run ever takes longer than expected.
concurrency:
  group: nowcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state/ and archive/ back to the repo

jobs:
  update-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one nowcast polling cycle
        run: python nowcast_bot.py

      - name: Rebase onto latest main before committing
        # A run's git history is fixed the moment actions/checkout runs,
        # but the polling cycle above can take a little while -- if a
        # manual code push (or another run, in a rarer race) lands on
        # main in that window, this run's later commit+push would be
        # rejected as non-fast-forward and its state update silently
        # lost (this is exactly what happened once: a manual push landed
        # mid-run and the state commit that followed got rejected).
        # --autostash handles the uncommitted state/archive/output files
        # this step runs with in the working tree: stash them, fast-
        # forward onto whatever's newest on main (there's nothing of
        # ours to replay -- nothing's committed yet), then restore them
        # on top. continue-on-error, because even if this ever does hit
        # a genuine conflict, that should cost this one cycle's tracking
        # state -- which self-heals next run -- not the live map upload
        # in the step after this one.
        run: git fetch origin main && git rebase origin/main --autostash
        continue-on-error: true

      - name: Commit updated tracking state + frame archive
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update nowcast tracking state"
          file_pattern: "state/ archive/"
          commit_user_name: "nowcast-bot"
          commit_user_email: "actions@users.noreply.github.com"

      - name: Upload storm_forecast_map.html to plots.chennairains.com (atomic swap)
        # Not FTP-Deploy-Action: it overwrites the live filename directly via
        # STOR (a multi-MB file, since folium base64-embeds the raster
        # overlay PNGs into the HTML), so the plain rewrite takes long enough
        # over FTP that a visitor hitting the URL mid-upload can get a broken
        # or missing response. This bot redeploys roughly every 15 minutes,
        # so that exposure window recurs constantly rather than twice a day.
        # Fix: upload to a throwaway name, then rename it into place only
        # once the transfer is fully complete -- the live filename always
        # points at a complete file (old or new), and the rename itself is
        # effectively instant.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            cd $FTP_REMOTE_DIR;
            put output/storm_forecast_map.html -o storm_forecast_map.uploading.html;
            rm -f storm_forecast_map.html;
            mv storm_forecast_map.uploading.html storm_forecast_map.html;
            bye
          " "$FTP_HOST"
