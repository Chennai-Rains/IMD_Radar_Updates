name: Update nowcast radar map

on:
  # No native `schedule:` trigger here -- GitHub's own cron for a 15-minute
  # interval turned out to be unreliable in practice (real gaps of several
  # hours between fires, see git history around 2026-09-29), so an external
  # pinger (cron-job.org) now calls this workflow's `workflow_dispatch` API
  # endpoint every 15 minutes instead -- see README for the setup. Keeping
  # BOTH triggers active was tried first ("harmless redundant backup"), but
  # that turned out to be an active liability: the two independent 15-min
  # schedules would occasionally fire only a couple of minutes apart, and
  # that tighter-than-normal gap between polls was the direct cause of a
  # real bug (a storm cell briefly showing an impossible ~1560 km/h speed --
  # see track_cells' MAX_PLAUSIBLE_CELL_SPEED_KMH / poll_and_decode's
  # content-hash is_new_frame comment in nowcast_bot.py for the full story).
  # That specific failure mode is now fixed defensively either way, but
  # there's no upside left to firing this from two independent schedulers,
  # so the unreliable one is simply removed.
  workflow_dispatch: {}
    # Lets you trigger a run manually from the Actions tab any time you
    # want to test a change without waiting for the external pinger's next
    # tick -- and is also what the external cron-job.org pinger calls.

# Only one run at a time -- the external 15-minute pinger shouldn't
# normally overlap itself, but this is cheap insurance against two runs
# racing to commit/push state at once if a run ever takes longer than
# expected.
concurrency:
  group: nowcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state/ and archive/ back to the repo

jobs:
  update-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Explicit `main`, not the default. Without this, checkout uses
          # github.sha, which for workflow_dispatch is resolved to main's
          # tip the MOMENT the run is dispatched/queued -- not when it
          # actually starts executing. The concurrency group above
          # serializes EXECUTION (only one run at a time), but does nothing
          # about that stale ref: a run queued behind another (e.g. a
          # manual dispatch fired close to the external pinger's own tick)
          # still checks out the OLD commit from its own dispatch moment
          # once it's finally its turn, missing whatever the run(s) ahead
          # of it just pushed. That's exactly what caused a real failure:
          # the queued run's local state didn't know about an archive
          # frame the run ahead of it had already saved+committed under
          # the same filename (same source timestamp, nothing had changed
          # on IMD's end between the two), so it re-saved it locally, and
          # the later `git fetch && git rebase origin/main` below found
          # that filename already committed upstream -- a genuine, if
          # already-handled-safely (see that step below), file collision.
          # Pinning to `main` here means every run, however long it sat
          # queued, always starts from the true current tip.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one nowcast polling cycle
        run: python nowcast_bot.py

      - name: Rebase onto latest main before committing
        # A run's git history is fixed the moment actions/checkout runs,
        # but the polling cycle above can take a little while -- if a
        # manual code push (or another run, in a rarer race) lands on
        # main in that window, this run's later commit+push would be
        # rejected as non-fast-forward and its state update silently
        # lost (this is exactly what happened once: a manual push landed
        # mid-run and the state commit that followed got rejected).
        # --autostash handles the uncommitted state/archive/output files
        # this step runs with in the working tree: stash them, fast-
        # forward onto whatever's newest on main (there's nothing of
        # ours to replay -- nothing's committed yet), then restore them
        # on top. continue-on-error, because even if this ever does hit
        # a genuine conflict, that should cost this one cycle's tracking
        # state -- which self-heals next run -- not the live map upload
        # in the step after this one.
        #
        # Explicitly cleaning up a failed rebase matters, not just
        # tolerating it: a plain conflict leaves the repo mid-rebase
        # (detached HEAD, unmerged index), and that broken state is what
        # actually took the site down once -- the commit step after this
        # one (which has no continue-on-error) then failed for real
        # against that half-rebased tree, which in turn made the upload
        # step after THAT skip entirely (steps without an explicit `if:`
        # only run if every step before them succeeded, and continue-
        # on-error on THIS step doesn't extend to steps two levels down).
        # So: on any rebase failure, abort back to a clean, valid branch
        # state (autostash's own stash is restored by --abort; the `||
        # true` on the pop is just in case abort already restored it)
        # before moving on, so the commit step always has normal,
        # uncommitted working-tree changes to work with -- worst case
        # this cycle's commit lands a step behind main instead of neatly
        # rebased onto it, which self-heals next run either way.
        run: |
          git fetch origin main
          if ! git rebase origin/main --autostash; then
            echo "Rebase failed/conflicted -- aborting to a clean state so the commit+upload steps still run this cycle."
            git rebase --abort || true
            git stash pop || true
          fi
        continue-on-error: true

      - name: Commit updated tracking state + frame archive
        # mosaic_frames/, radar_loop/ and mosaic_basemap.png added for the
        # 3h/6h/12h radar loop: mosaic_frames/ needs to persist between
        # runs for the same reason archive/ already does (something for
        # the next run to diff/accumulate against -- here, enough frame
        # history to animate from); radar_loop/ holds the built GIFs/page
        # between hourly rebuilds so they can be re-copied into output/
        # every cycle even on the 3-out-of-4 cycles that don't rebuild
        # them (see publish_radar_loop()'s docstring for why that copy
        # can't just be skipped); mosaic_basemap.png is fetched once ever
        # and committed so later runs never re-hit the tile server.
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "Update nowcast tracking state"
          file_pattern: "state/ archive/ mosaic_frames/ radar_loop/ mosaic_basemap.png"
          commit_user_name: "nowcast-bot"
          commit_user_email: "actions@users.noreply.github.com"

      - name: Upload storm_forecast_map.html to plots.chennairains.com
        # Runs even if the state-tracking commit above failed (e.g. a
        # push race that self-heals next cycle) -- the map file itself
        # was already built fresh in "Run one nowcast polling cycle"
        # regardless of git's outcome, and a tracking-state hiccup should
        # never be the reason the live site misses an update. Only skips
        # if the job itself was cancelled.
        if: ${{ !cancelled() }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # cPanel's FTP Accounts page for this account explicitly offers
          # "FTP & explicit FTPS" on port 21 -- explicit FTPS negotiates
          # TLS over the same plain-FTP port (STARTTLS-style), so this is
          # both more secure than plain FTP and matches what the host
          # actually advertises supporting.
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map.html.
          dangerous-clean-slate: false

      - name: Purge Cloudflare cache for the files just uploaded
        # plots.chennairains.com is proxied through Cloudflare. Once
        # Cache Rules are set up there to cache the two HTML pages (see
        # README's "Cloudflare caching" section -- Cloudflare doesn't
        # cache HTML by default even with this repo's .htaccess Cache-
        # Control headers, only the file types, like images, it treats
        # as static by default), a viewer could otherwise be served an
        # edge-cached copy for up to that Cache Rule's TTL after a fresh
        # upload, rather than the TTL just bounding the worst case the
        # way it does today with no edge caching at all. Purging these
        # specific URLs right after every upload closes that gap, so
        # Cloudflare can cache aggressively BETWEEN uploads (that's where
        # the actual origin-load savings come from) while still serving
        # the newest build within seconds of it landing, not minutes.
        #
        # No-ops safely (skips entirely) until CLOUDFLARE_API_TOKEN and
        # CLOUDFLARE_ZONE_ID secrets are added -- see README for where to
        # get each one. Never fails the run either way: a missed purge
        # just means Cloudflare serves a cached page for up to its own
        # Cache Rule TTL, which is a minor staleness, not a broken site.
        # The `secrets.X != ''` check belongs in the shell, not this
        # step's `if:` -- the workflow_dispatch API's static validator
        # rejects `secrets.*` references inside a step-level `if:`
        # expression outright ("Unrecognized named-value: 'secrets'"),
        # so the no-op has to happen inside `run:` instead, after the
        # secrets are passed through as plain env vars.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN/CLOUDFLARE_ZONE_ID not set -- skipping purge (see README)"
            exit 0
          fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files": [
              "https://plots.chennairains.com/storm_forecast_map.html",
              "https://plots.chennairains.com/radar_loop.html",
              "https://plots.chennairains.com/radar_loop_3h.gif",
              "https://plots.chennairains.com/radar_loop_6h.gif",
              "https://plots.chennairains.com/radar_loop_12h.gif"
            ]}'
